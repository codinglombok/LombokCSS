name: Visual regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    # Pinned to match the committed screenshot baselines (Chromium build 1194).
    # Bump this tag and the @playwright/test version together, then refresh
    # baselines with `npm run test:visual:update` inside the same image.
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
    steps:
      - uses: actions/checkout@v7
      - name: Ensure python (for docs build)
        run: python3 --version || (apt-get update && apt-get install -y python3)
      - run: npm ci
      # Rebuild CSS/JS and docs so tested pages reflect current src/
      - run: npm run build && npm run build:docs
      - name: Run visual tests
        run: npm run test:visual
      - name: Upload diff report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  behavior:
    runs-on: ubuntu-latest
    # Same container as the visual job: it already ships Chromium, so no
    # `playwright install` download is needed. Behaviour tests load no CSS and
    # take no screenshots, so the image tag does not have to match any baseline.
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      # dist/lombok.js is what the tests load, so build it from current src/
      - run: npm run build
      - name: Run behaviour tests
        run: npm run test:behavior
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: behavior-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
