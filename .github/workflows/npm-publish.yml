# ──────────────────────────────────────────────────────────────────────────────
# LombokCSS — Publish to npmjs.org
# Triggered on GitHub Release publish or manual dispatch.
# Quality gate: lint + test (size check + SSR guard) + build + dist freshness.
#
# Does NOT replace: publish-packages.yml (GitHub Packages — npm/Container/
#                   Maven/NuGet/RubyGems), release-please.yml
# ──────────────────────────────────────────────────────────────────────────────
name: Publish to npm

# Default deny; every job below declares the scopes it actually needs.
permissions:
  contents: read
on:
  release:
    types: [published]
  workflow_dispatch: {}   # manual trigger fallback
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }  # id-token for npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24', registry-url: 'https://registry.npmjs.org', cache: 'npm' }
      - run: npm ci

      - name: Quality gate before publish
        run: |
          npm run lint
          npm test
          npm run build

      - name: Verify dist is up to date
        run: |
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/ is stale — build output differs from committed dist"
            exit 1
          fi

      - name: Sync version from release tag (v1.2.3 -> 1.2.3)
        if: github.event_name == 'release'
        run: npm version ${GITHUB_REF_NAME#v} --no-git-tag-version

      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
