# ──────────────────────────────────────────────────────────────────────────────
# LombokCSS — Publish to ALL 5 GitHub Packages Registries
# Called from release-please.yml after a release is created.
# (Events created by GITHUB_TOKEN don't trigger other workflows,
#  so this MUST be invoked via workflow_call, not push/release triggers.)
#
# Publishes:
#   1. npm          → npm.pkg.github.com
#   2. Container    → ghcr.io  (nginx serving dist CSS/JS)
#   3. Maven        → maven.pkg.github.com (webjar)
#   4. NuGet        → nuget.pkg.github.com
#   5. RubyGems     → rubygems.pkg.github.com (existing gemspec)
#
# Does NOT replace: release-please.yml (npmjs.org)
# ──────────────────────────────────────────────────────────────────────────────
name: Publish GitHub Packages (All Registries)

on:
  workflow_call:
    inputs:
      version:
        description: 'Semver version WITHOUT leading v (e.g. 0.1.8)'
        required: true
        type: string

# Default deny — each job declares only what it needs.
permissions: {}

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # 0. Shared build artifact
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/
            src/
            lib/
            lombokcss.gemspec
            package.json
            README.md
            LICENSE
            CHANGELOG.md
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════════════════
  # 1. npm → GitHub Packages
  # ═══════════════════════════════════════════════════════════════════════════
  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: dist }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@codinglombok'

      - name: Scope package for GPR
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.name = '@codinglombok/lombokcss';
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
      - name: Sync version from tag
        run: npm version "${{ inputs.version }}" --no-git-tag-version

      - run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════════════════════════
  # 2. Container → ghcr.io (nginx serving CSS/JS assets)
  # ═══════════════════════════════════════════════════════════════════════════
  publish-container:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/lombokcss
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate Dockerfile
        run: |
          cat > Dockerfile << 'DKEOF'
          FROM node:24-alpine AS build
          WORKDIR /app
          COPY package*.json ./
          COPY src ./src
          COPY scripts ./scripts
          COPY README.md ./
          RUN npm ci && npm run build

          FROM nginx:alpine
          COPY --from=build /app/dist /usr/share/nginx/html/dist
          COPY --from=build /app/src /usr/share/nginx/html/src
          COPY --from=build /app/README.md /usr/share/nginx/html/

          # Demo page showcasing all 5 styles
          RUN echo '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">' \
               '<meta name="viewport" content="width=device-width,initial-scale=1">' \
               '<title>LombokCSS</title>' \
               '<link rel="stylesheet" href="/dist/lombok.min.css">' \
               '<script defer src="/dist/lombok.js"></script></head>' \
               '<body data-style="modern-corporate-flat"><div class="container">' \
               '<h1>LombokCSS</h1><p>Token-first component CSS framework</p>' \
               '<button class="btn btn-primary">Primary</button>' \
               '<button class="btn btn-outline">Outline</button>' \
               '</div></body></html>' > /usr/share/nginx/html/index.html

          EXPOSE 80
          CMD ["nginx", "-g", "daemon off;"]
          DKEOF

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=LombokCSS — token-first component CSS framework
            org.opencontainers.image.licenses=MIT

  # ═══════════════════════════════════════════════════════════════════════════
  # 3. Maven → GitHub Packages (webjar)
  # ═══════════════════════════════════════════════════════════════════════════
  publish-maven:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: dist }

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'XML'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          XML

      - name: Build webjar & deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          WJ="src/main/resources/META-INF/resources/webjars/lombokcss/${VERSION}"

          mkdir -p "${WJ}"
          cp dist/lombok.css dist/lombok.min.css dist/lombok.js "${WJ}/"
          cp README.md LICENSE "${WJ}/"

          cat > pom.xml << POMEOF
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0
                   http://maven.apache.org/xsd/maven-4.0.0.xsd"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.github.codinglombok</groupId>
            <artifactId>lombokcss</artifactId>
            <version>${VERSION}</version>
            <packaging>jar</packaging>
            <name>LombokCSS</name>
            <description>Token-first component CSS framework — webjar distribution</description>
            <url>https://github.com/codinglombok/LombokCSS</url>
            <licenses>
              <license>
                <name>MIT</name>
                <url>https://opensource.org/licenses/MIT</url>
              </license>
            </licenses>
            <scm>
              <url>https://github.com/codinglombok/LombokCSS</url>
            </scm>
            <distributionManagement>
              <repository>
                <id>github</id>
                <url>https://maven.pkg.github.com/codinglombok/LombokCSS</url>
              </repository>
            </distributionManagement>
          </project>
          POMEOF

          mvn deploy -B -DskipTests

  # ═══════════════════════════════════════════════════════════════════════════
  # 4. NuGet → GitHub Packages
  # ═══════════════════════════════════════════════════════════════════════════
  publish-nuget:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: dist }

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.x'

      - name: Pack & push
        run: |
          VERSION="${{ inputs.version }}"

          mkdir -p nuget-pkg/content/dist
          cp dist/lombok.css dist/lombok.min.css dist/lombok.js nuget-pkg/content/dist/
          cp README.md LICENSE nuget-pkg/

          cat > nuget-pkg/LombokCSS.csproj << CSPROJ
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>netstandard2.0</TargetFramework>
              <PackageId>codinglombok.LombokCSS</PackageId>
              <Version>${VERSION}</Version>
              <Authors>codinglombok</Authors>
              <Description>Token-first component CSS framework — one markup, five design styles, dark mode + RTL, ~10KB gzipped</Description>
              <PackageLicenseExpression>MIT</PackageLicenseExpression>
              <PackageProjectUrl>https://github.com/codinglombok/LombokCSS</PackageProjectUrl>
              <RepositoryUrl>https://github.com/codinglombok/LombokCSS</RepositoryUrl>
              <RepositoryType>git</RepositoryType>
              <PackageTags>css framework components design-tokens theming dark-mode rtl</PackageTags>
              <PackageReadmeFile>README.md</PackageReadmeFile>
              <IncludeBuildOutput>false</IncludeBuildOutput>
              <NoBuild>true</NoBuild>
              <NoDefaultExcludes>true</NoDefaultExcludes>
            </PropertyGroup>
            <ItemGroup>
              <Content Include="content/**/*" PackagePath="content/" />
              <None Include="README.md" Pack="true" PackagePath="/" />
              <None Include="LICENSE" Pack="true" PackagePath="/" />
            </ItemGroup>
          </Project>
          CSPROJ

          cd nuget-pkg
          dotnet pack -o ../nupkg --no-build -p:NoBuild=true 2>/dev/null || \
            dotnet pack -o ../nupkg 2>/dev/null || true
          cd ..

          if ! ls nupkg/*.nupkg 2>/dev/null; then
            mkdir -p nupkg
            cd nuget-pkg && zip -r ../nupkg/codinglombok.LombokCSS.${VERSION}.nupkg . -x '.*' && cd ..
          fi

          dotnet nuget add source \
            --username codinglombok \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/codinglombok/index.json"

          dotnet nuget push "nupkg/*.nupkg" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source github --skip-duplicate

  # ═══════════════════════════════════════════════════════════════════════════
  # 5. RubyGems → GitHub Packages (uses existing gemspec + lib/)
  # ═══════════════════════════════════════════════════════════════════════════
  publish-rubygems:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: dist }

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.2'

      - name: Build & push gem
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"

          # Sync version from tag so gem gets the correct version
          sed -i "s/VERSION = .*/VERSION = \"${VERSION}\" # x-release-please-version/" lib/lombokcss/version.rb

          # Repo already has lombokcss.gemspec + lib/ — build directly
          gem build lombokcss.gemspec

          mkdir -p ~/.gem
          echo "---"                                > ~/.gem/credentials
          echo ":github: Bearer ${GITHUB_TOKEN}"   >> ~/.gem/credentials
          chmod 0600 ~/.gem/credentials

          gem push --key github \
            --host https://rubygems.pkg.github.com/codinglombok \
            "lombokcss-${VERSION}.gem"
