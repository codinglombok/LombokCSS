name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write   # for npm provenance on the publish step

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # --- Publish to npm only when this run created a release ---
      # Done here (not in a separate release-triggered workflow) because events
      # created by GITHUB_TOKEN do not trigger other workflows.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ steps.release.outputs.release_created }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - if: ${{ steps.release.outputs.release_created }}
        run: npm ci
      - if: ${{ steps.release.outputs.release_created }}
        run: npm run build
      - name: Publish to npm (skip if version already exists)
        if: ${{ steps.release.outputs.release_created }}
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view "lombokcss@$VER" version >/dev/null 2>&1; then
            echo "lombokcss@$VER already on npm — skipping publish."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # --- Publish to all 5 GitHub Packages registries ---
  # Called as a reusable workflow so it runs in THIS workflow's context
  # (events from GITHUB_TOKEN don't trigger separate workflows).
  publish-github-packages:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/publish-packages.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
