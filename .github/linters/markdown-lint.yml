---
# Konfigurasi markdownlint untuk Super-Linter (VALIDATE_MARKDOWN).
# CHANGELOG.md ditulis oleh release-please, bukan manusia — memaksakan
# aturan gaya di situ akan menggagalkan setiap PR rilis.

default: true

# MD013 line-length: CHANGELOG dan tabel badge wajar melewati 80 kolom.
MD013: false

# MD033 inline HTML: README memakai <img>/<details> untuk badge dan seksi lipat.
MD033: false

# MD041 first-line-heading: CHANGELOG dan beberapa dok mulai dengan badge.
MD041: false

# MD024 duplicate heading: CHANGELOG mengulang heading tiap versi
# ("Features", "Bug Fixes"), jadi hanya sibling yang dicek.
MD024:
  siblings_only: true

# MD034 bare URLs: dibiarkan aktif — URL telanjang sebaiknya tetap dikurung.

# MD012 blank lines & MD004 bullet style: release-please menulis dua baris
# kosong setelah heading versi dan memakai "*" untuk bullet, sementara
# bagian CHANGELOG yang ditulis tangan memakai "-". Format bot ini
# diregenerasi tiap rilis, jadi tak bisa diperbaiki dengan menyunting file.
MD012: false
MD004: false
